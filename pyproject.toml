[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ict-signal-scanner"
version = "0.1.0"
description = "Ordered ICT liquidity -> BOS -> FVG Telegram signal scanner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "psutil>=6,<8",
  "python-dotenv>=1.0,<2",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.scripts]
ict-signal = "ict_signal.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ict_signal"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"

